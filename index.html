<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bienvenue</title>
  <meta name="description" content="Une page simple avec un message de bienvenue." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f6f1e8;
      --bg-accent: #efe4d2;
      --text: #1d1a17;
      --muted: #5f574d;
      --line: rgba(29, 26, 23, 0.12);
      --accent: #b85c38;
      --accent-2: #2f6f62;
      --panel: rgba(255, 255, 255, 0.5);
      --shadow: 0 20px 60px rgba(58, 38, 22, 0.12);
      --radius: 24px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Inter", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(184, 92, 56, 0.12), transparent 35%),
        radial-gradient(circle at bottom right, rgba(47, 111, 98, 0.14), transparent 30%),
        linear-gradient(180deg, var(--bg) 0%, #fbf8f3 100%);
      overflow: hidden;
    }

    .page {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: clamp(24px, 5vw, 56px);
      position: relative;
      isolation: isolate;
    }

    .page::before,
    .page::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      filter: blur(10px);
      z-index: -1;
      opacity: 0.8;
    }

    .page::before {
      width: 240px;
      height: 240px;
      top: 8%;
      left: 6%;
      background: linear-gradient(135deg, rgba(184, 92, 56, 0.18), rgba(184, 92, 56, 0.02));
    }

    .page::after {
      width: 300px;
      height: 300px;
      bottom: 6%;
      right: 4%;
      background: linear-gradient(135deg, rgba(47, 111, 98, 0.18), rgba(47, 111, 98, 0.02));
    }

    .welcome {
      width: min(760px, 100%);
      padding: clamp(28px, 4vw, 56px);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      backdrop-filter: blur(14px);
      box-shadow: var(--shadow);
      position: relative;
      overflow: hidden;
      animation: rise 0.9s ease-out both;
    }

    .welcome::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, transparent 0 48%, rgba(29, 26, 23, 0.04) 48% 52%, transparent 52%),
        linear-gradient(0deg, transparent 0 48%, rgba(29, 26, 23, 0.04) 48% 52%, transparent 52%);
      background-size: 120px 120px;
      mask-image: linear-gradient(to bottom, rgba(0,0,0,0.14), transparent 70%);
      pointer-events: none;
    }

    .eyebrow {
      margin: 0 0 14px;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--accent-2);
      animation: rise 0.9s ease-out 0.12s both;
    }

    h1 {
      margin: 0;
      font-family: "Syne", sans-serif;
      font-size: clamp(2.8rem, 8vw, 6rem);
      line-height: 0.95;
      letter-spacing: -0.05em;
      text-wrap: balance;
      animation: rise 0.9s ease-out 0.24s both;
    }

    .subtitle {
      margin: 18px 0 0;
      max-width: 38ch;
      font-size: clamp(1rem, 2vw, 1.2rem);
      line-height: 1.7;
      color: var(--muted);
      animation: rise 0.9s ease-out 0.36s both;
    }

    .accent {
      color: var(--accent);
    }

    .line {
      width: 84px;
      height: 4px;
      margin: 28px 0 0;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      animation: rise 0.9s ease-out 0.48s both;
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(24px) scale(0.985);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @media (max-width: 640px) {
      body {
        overflow: auto;
      }

      .welcome {
        border-radius: 20px;
      }

      .subtitle {
        max-width: 100%;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="welcome" aria-labelledby="titre-bienvenue">
      <p class="eyebrow">Index.html</p>
      <h1 id="titre-bienvenue">Bienvenue <span class="accent">sur votre site</span></h1>
      <p class="subtitle">
        Ceci est une page d’accueil simple, propre et élégante avec un message de bienvenue.
      </p>
      <div class="line" aria-hidden="true"></div>
    </section>
  </main>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      document.querySelector(".welcome")?.setAttribute("tabindex", "-1");
    });
  </script>
</body>
</html>
